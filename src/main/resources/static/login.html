<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #333;
            margin: 0;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: #45a049;
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .register-link {
            text-align: center;
            margin-top: 1rem;
        }

        .register-link a {
            color: #4CAF50;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>會員登入</h1>
        </div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">用戶名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button">登入</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
        <div id="loading" class="loading"></div>
        <div class="register-link">
            <a href="/register.html">還沒有帳號？立即註冊</a>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            const loginButton = document.querySelector('.login-button');

            // 重置錯誤訊息
            errorMessage.style.display = 'none';
            // 顯示載入動畫
            loading.style.display = 'block';
            // 禁用登入按鈕
            loginButton.disabled = true;

            try {
                const response = await fetch('http://localhost:8091/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    // 登入成功，重定向到會員頁面
                    window.location.href = '/member.html';
                } else {
                    // 顯示錯誤訊息
                    errorMessage.textContent = data.message || '登入失敗，請檢查用戶名和密碼';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = '發生錯誤，請稍後再試';
                errorMessage.style.display = 'block';
            } finally {
                // 隱藏載入動畫
                loading.style.display = 'none';
                // 啟用登入按鈕
                loginButton.disabled = false;
            }

            return false;
        }

        // 檢查是否已登入
        async function checkLoginStatus() {
            try {
                const response = await fetch('http://localhost:8091/api/users/current', {
                    credentials: 'include'
                });

                if (response.ok) {
                    // 已登入，重定向到會員頁面
                    window.location.href = '/member.html';
                }
            } catch (error) {
                console.error('檢查登入狀態時發生錯誤:', error);
            }
        }

        // 頁面載入時檢查登入狀態
        checkLoginStatus();
    </script>
</body>

</html>
