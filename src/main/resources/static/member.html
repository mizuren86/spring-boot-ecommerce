<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .welcome {
            margin: 0;
            color: #333;
        }

        .user-info {
            color: #666;
        }

        .logout-btn {
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .content {
            margin-top: 20px;
        }

        .error-message {
            color: #dc3545;
            background-color: #fff3f3;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 class="welcome">歡迎回來</h1>
                <p class="user-info" id="userInfo">載入中...</p>
            </div>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
        <div class="content" id="content">
            <!-- 這裡可以放置會員專屬內容 -->
        </div>
    </div>

    <script>
        // 檢查登入狀態
        async function checkLoginStatus() {
            try {
                const response = await fetch('http://localhost:8091/api/users/current', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userInfo').textContent =
                        `${user.fullName || user.username}`;
                    loadMemberContent(user);
                } else {
                    // 未登入，重定向到登入頁
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML =
                    '<div class="error-message">載入失敗，請重新整理頁面</div>';
            }
        }

        // 載入會員內容
        function loadMemberContent(user) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2>會員資料</h2>
                <p>會員編號：${user.memberId}</p>
                <p>用戶名：${user.username}</p>
                <p>姓名：${user.fullName || '未設定'}</p>
                <p>Email：${user.email || '未設定'}</p>
                <p>電話：${user.phone || '未設定'}</p>
                <p>地址：${user.address || '未設定'}</p>
            `;
        }

        // 登出功能
        async function logout() {
            try {
                const response = await fetch('http://localhost:8091/api/users/logout', {
                    method: 'POST',
                    credentials: 'include'
                });

                if (response.ok) {
                    window.location.href = '/login.html';
                } else {
                    alert('登出失敗，請重試');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('系統錯誤，請稍後再試');
            }
        }

        // 頁面載入時檢查登入狀態
        checkLoginStatus();
    </script>
</body>

</html>
