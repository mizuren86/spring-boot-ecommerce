<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .verification-group {
            display: flex;
            gap: 1rem;
        }

        .verification-group input {
            flex: 2;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
            width: 100%;
        }

        .btn-secondary {
            background-color: #2196F3;
            color: white;
            flex: 1;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #f44336;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">會員註冊</h2>
        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="form-group">
                <label for="username">用戶名 *</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">密碼 *</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="email">電子郵件 *</label>
                <div class="verification-group">
                    <input type="email" id="email" required>
                    <button type="button" class="btn btn-secondary" onclick="sendVerification('email')"
                        id="emailVerifyBtn">
                        發送驗證碼
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="phone">手機號碼</label>
                <div class="verification-group">
                    <input type="tel" id="phone" pattern="[0-9]{10}">
                    <button type="button" class="btn btn-secondary" onclick="sendVerification('phone')"
                        id="phoneVerifyBtn">
                        發送驗證碼
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="verificationCode">驗證碼 *</label>
                <input type="text" id="verificationCode" required>
            </div>
            <div class="form-group">
                <label for="fullName">姓名 *</label>
                <input type="text" id="fullName" required>
            </div>
            <button type="submit" class="btn btn-primary">註冊</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="/login.html">已有帳號？立即登入</a>
        </div>
    </div>

    <script>
        let verificationSent = false;

        async function sendVerification(type) {
            const contact = document.getElementById(type).value;
            if (!contact) {
                showError(`請輸入${type === 'email' ? '電子郵件' : '手機號碼'}`);
                return;
            }

            const button = document.getElementById(`${type}VerifyBtn`);
            button.disabled = true;

            try {
                const response = await fetch('http://localhost:8091/api/users/send-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ [type]: contact })
                });

                if (response.ok) {
                    verificationSent = true;
                    showSuccess('驗證碼已發送，請查收');
                    startCountdown(button);
                } else {
                    const data = await response.json();
                    showError(data.message || '發送驗證碼失敗');
                    button.disabled = false;
                }
            } catch (error) {
                showError('發送驗證碼時發生錯誤');
                button.disabled = false;
            }
        }

        function startCountdown(button) {
            let seconds = 60;
            button.textContent = `重新發送(${seconds}s)`;

            const interval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(interval);
                    button.disabled = false;
                    button.textContent = '發送驗證碼';
                } else {
                    button.textContent = `重新發送(${seconds}s)`;
                }
            }, 1000);
        }

        async function handleRegister(event) {
            event.preventDefault();

            if (!verificationSent) {
                showError('請先獲取驗證碼');
                return false;
            }

            const registerData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                fullName: document.getElementById('fullName').value,
                verificationCode: document.getElementById('verificationCode').value
            };

            try {
                const response = await fetch('http://localhost:8091/api/users/register-with-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('註冊成功！即將跳轉到登入頁面...');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(data.message || '註冊失敗');
                }
            } catch (error) {
                showError('註冊時發生錯誤');
            }

            return false;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }
    </script>
</body>

</html>
